name: evgo
description: EVGO customer app. Bus tickets and EV charging in one app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_cashfree_pg_sdk: ^2.7.0+55
  flutter_map: ^8.3.2
  http: ^1.2.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/evgo-logo.png

# App icons for Android and iOS: run `dart run flutter_launcher_icons` after `flutter create`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/evgo-icon.png
  remove_alpha_ios: true
