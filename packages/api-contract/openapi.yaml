openapi: 3.1.0
info:
  title: EVGO API
  version: 0.5.0
  description: >
    Single API for the EVGO customer apps (Flutter mobile, Next.js web) and the
    operator console. Typed clients for Dart and TypeScript are generated from
    this file so booking, pricing and wallet types stay in sync.
servers:
  - url: http://localhost:3001/v1
paths:
  /health:
    get:
      summary: Service health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, service: { type: string } } }
  /trips:
    get:
      summary: Search bus trips between two cities
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, example: Guntur }
        - { name: to, in: query, required: true, schema: { type: string }, example: Hyderabad }
      responses:
        "200":
          description: Matching trips
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TripSummary" } }
        "400": { description: from or to missing }
  /chargers:
    get:
      summary: Search public chargers
      parameters:
        - name: segment
          in: query
          schema: { $ref: "#/components/schemas/Segment" }
        - { name: city, in: query, schema: { type: string } }
      responses:
        "200":
          description: Matching chargers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Charger" } }
  /chargers/{id}:
    get:
      summary: Charger detail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Charger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charger" }
        "404": { description: Not found }
  /auth/otp/request:
    post:
      summary: Send a login code by SMS
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone], properties: { phone: { type: string, example: "9876543210" } } }
      responses:
        "200":
          description: Code sent. devCode is present only on development servers.
          content:
            application/json:
              schema: { type: object, properties: { phone: { type: string }, expiresInSec: { type: integer }, devCode: { type: string } } }
        "400": { description: Not a valid Indian mobile number }
        "429": { description: Asked again too soon, or more than 5 codes in an hour }
  /auth/otp/verify:
    post:
      summary: Exchange a login code for an access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string } } }
      responses:
        "200":
          description: Logged in. Creates the user and wallet on first login.
          content:
            application/json:
              schema: { type: object, properties: { accessToken: { type: string }, user: { $ref: "#/components/schemas/User" } } }
        "401": { description: Wrong, expired or used code, or too many attempts }
  /me:
    get:
      summary: The logged-in user
      security: [{ bearer: [] }]
      responses:
        "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /charging/sessions:
    post:
      summary: Start charging on a connector (the charger QR carries chargePointId and connectorId)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [chargePointId, connectorId], properties: { chargePointId: { type: string, example: GNT-HUB-01 }, connectorId: { type: integer, example: 1 } } }
      responses:
        "201": { description: Session started, content: { application/json: { schema: { $ref: "#/components/schemas/ChargingSession" } } } }
        "402": { description: "Wallet below ₹100. Body has balancePaise and shortfallPaise." }
        "403": { description: Fleet-only charger }
        "404": { description: Unknown charger or connector }
        "409": { description: Connector busy or out of service, or a session already running }
        "503": { description: Charger did not respond, or app charging not switched on }
    get:
      summary: The user's latest charging sessions, the running one first (for Home)
      security: [{ bearer: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 5, maximum: 20 } }]
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema: { type: object, properties: { sessions: { type: array, items: { $ref: "#/components/schemas/ChargingSession" } } } }
  /charging/sessions/active:
    get:
      summary: The caller's running session, if any
      security: [{ bearer: [] }]
      responses:
        "200": { description: "{ session: ChargingSession | null }" }
  /charging/sessions/{id}:
    get:
      summary: Live session (energy, cost, power). Stops itself once it has used the wallet balance it started with.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/ChargingSession" } } } }
  /charging/sessions/{id}/stop:
    post:
      summary: Stop and pay energy × tariff from the wallet
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: Stopped and billed. Includes balancePaise. }
        "409": { description: Already stopped }
  /charging/upi-blocks:
    post:
      summary: Pay by UPI with no wallet. Block an amount (₹100 to ₹10,000) for a session; the customer approves in their UPI app
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chargePointId, connectorId, amountPaise]
              properties:
                chargePointId: { type: string }
                connectorId: { type: integer }
                amountPaise: { type: integer, example: 50000 }
      responses:
        "201": { description: Waiting for approval, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentBlock" } } } }
        "400": { description: Amount out of range }
        "409": { description: Connector busy or out of service, or a session already running }
        "503": { description: Paying by UPI is not switched on }
  /charging/upi-blocks/{id}/start:
    post:
      summary: Call after the customer returns from the UPI app (safe to repeat). Starts charging once the amount is blocked
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201":
          description: "session is null while approval is pending"
          content:
            application/json:
              schema:
                type: object
                properties:
                  block: { $ref: "#/components/schemas/PaymentBlock" }
                  session: { oneOf: [{ $ref: "#/components/schemas/ChargingSession" }, { type: "null" }] }
        "402": { description: Declined or expired in the UPI app }
        "409": { description: Connector taken meanwhile; the block is released }
  /charging/upi-blocks/{id}:
    delete:
      summary: Give up before charging starts; releases the block
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Released, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentBlock" } } } }
  /charging/upi-blocks/{id}/mock-approve:
    post:
      summary: Development only. Stands in for approving in the UPI app (mock-decline declines)
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: Approved }
  /wallet:
    get:
      summary: Wallet balance and latest 50 movements
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                type: object
                properties:
                  balancePaise: { type: integer }
                  history:
                    type: array
                    items: { type: object, properties: { id: { type: string }, amountPaise: { type: integer, description: "Positive in, negative out" }, memo: { type: string }, at: { type: string, format: date-time } } }
  /wallet/topups:
    post:
      summary: Start adding money (₹1 to ₹1,00,000)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amountPaise], properties: { amountPaise: { type: integer } } }
      responses:
        "201":
          description: "Pending top-up and the Cashfree checkout to open (gateway is \"mock\" on development servers)."
          content:
            application/json:
              schema: { type: object, properties: { topUpId: { type: string }, amountPaise: { type: integer }, status: { type: string }, gateway: { type: string }, checkout: { type: object, properties: { gatewayOrderId: { type: string }, paymentSessionId: { type: string }, environment: { type: [string, "null"], enum: [SANDBOX, PRODUCTION, null] } } } } }
        "400": { description: Amount out of range }
        "503": { description: Online payments not switched on }
  /wallet/topups/{id}/check:
    post:
      summary: After the checkout closes, ask whether the top-up was paid. Credits the wallet once.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: "status is SUCCEEDED, PENDING or FAILED; balancePaise." }
  /wallet/topups/{id}/mock-confirm:
    post:
      summary: Development only. Stands in for paying on the checkout (body method upi, card or netbanking).
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: Credited (idempotent) }
  /trips/{id}/seats:
    get:
      summary: Seat map with live availability
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Seats
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripId: { type: string }
                  departsAt: { type: string, format: date-time }
                  seats:
                    type: array
                    items: { type: object, properties: { seatLabel: { type: string }, farePaise: { type: integer }, status: { type: string, enum: [available, held, booked, blocked] } } }
  /bookings:
    post:
      summary: Hold up to 6 seats for 10 minutes
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripId, seats]
              properties:
                tripId: { type: string }
                seats: { type: array, items: { type: object, required: [seatLabel, passengerName], properties: { seatLabel: { type: string }, passengerName: { type: string } } } }
      responses:
        "201":
          description: Seats held
          content:
            application/json:
              schema: { type: object, properties: { orderId: { type: string }, status: { type: string }, totalPaise: { type: integer }, expiresAt: { type: string, format: date-time }, seats: { type: array, items: { type: string } } } }
        "409": { description: A seat is already held or booked }
    get:
      summary: My bus bookings, with everything the ticket screen shows
      security: [{ bearer: [] }]
      responses:
        "200":
          description: >
            Bookings newest first. Each has orderId, status, totalPaise, bookedAt, route, departsAt, departs (IST HH:mm),
            boarding and dropping ({ name, city, at, time }), operator, bus ({ registration } or null),
            payment ({ method, amountPaise, at } or null), refundPaise, cancellationPolicy (refund tiers),
            and tickets ({ ticketCode, seatLabel, passengerName, status, farePaise }).
  /bookings/{id}/pay:
    post:
      summary: Pay for held seats from the wallet and issue tickets
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: Paid. Returns tickets and new balance. }
        "402": { description: "Wallet short. Body has balancePaise and shortfallPaise." }
        "409": { description: Already paid or cancelled }
        "410": { description: Hold expired }
  /bookings/{id}/checkout:
    post:
      summary: Pay for held seats by UPI, card or netbanking on Cashfree's checkout. Returns the checkout to open.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201":
          description: Checkout opened
          content:
            application/json:
              schema: { type: object, properties: { orderId: { type: string }, paymentId: { type: string }, gateway: { type: string }, amountPaise: { type: integer }, holdExpiresAt: { type: string, format: date-time }, checkout: { type: object, properties: { gatewayOrderId: { type: string }, paymentSessionId: { type: string }, environment: { type: [string, "null"], enum: [SANDBOX, PRODUCTION, null] } } } } }
        "409": { description: Already paid or cancelled }
        "410": { description: Hold expired }
        "503": { description: Online payments not switched on }
  /bookings/{id}/checkout/check:
    post:
      summary: "After the checkout closes: issue tickets if paid. If the seats were released before the money arrived, the order is CANCELLED and refunded in full."
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: "status PAID (with tickets and payment.method), PENDING, or CANCELLED (with refunds and message)." }
  /bookings/{id}/checkout/mock-pay:
    post:
      summary: Development only. Stands in for paying on the checkout (body method upi, card or netbanking).
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: Same as check }
  /bookings/{id}/hold:
    delete:
      summary: Release unpaid held seats
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Released }
  /bookings/{id}/cancel:
    post:
      summary: "Cancel a paid booking under the operator's policy (default 90% at 24h or more before departure, 50% at 6 to 24h, closed under 6h). The refund goes back the way the customer paid: wallet, or through Cashfree to UPI, card or bank."
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: "Cancelled. Body has refundPaise, cancellationFeePaise, refundTo (wallet, upi, card, netbanking…), refundStatus (SUCCEEDED, PENDING), balancePaise." }
        "400": { description: Too close to departure }
  /payments/cashfree/webhook:
    post:
      summary: "Cashfree payment and refund webhooks. Signed (x-webhook-signature = base64 HMAC-SHA256 of x-webhook-timestamp + raw body with the secret key). Only triggers a status check with Cashfree."
      responses:
        "200": { description: Received }
        "401": { description: Bad signature }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        phone: { type: string }
        name: { type: [string, "null"] }
    Segment:
      type: string
      enum: ["2W", "3W", "4W", "BUS", "TRUCK"]
    Place:
      type: object
      required: [id, name, city, lat, lng]
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        lat: { type: number }
        lng: { type: number }
    TripSummary:
      type: object
      required: [id, operator, from, to, departs, arrives, busType, seatsLeft, fareInr, chargersAtBoarding]
      properties:
        id: { type: string }
        operator: { type: string }
        from: { type: string }
        to: { type: string }
        departsAt: { type: string, format: date-time }
        arrivesAt: { type: string, format: date-time }
        departs: { type: string, example: "06:00", description: Local time (IST) }
        arrives: { type: string, example: "11:30" }
        busType: { type: string }
        seatsLeft: { type: integer }
        fareInr: { type: integer }
        chargersAtBoarding:
          type: integer
          description: Public chargers at the boarding point (powers the park, charge, ride journey)
    ChargingSession:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [ACTIVE, STOPPED] }
        chargePointId: { type: string }
        connectorId: { type: integer }
        connectorType: { type: string }
        placeName: { type: string }
        perKwhInr: { type: number }
        startedAt: { type: string, format: date-time }
        stoppedAt: { type: [string, "null"], format: date-time }
        stopReason: { type: [string, "null"], description: "WalletLimit or AmountLimit when the money ran out", example: WalletLimit }
        energyKwh: { type: number }
        powerKw: { type: number }
        costPaise: { type: integer }
        balancePaise: { type: integer, description: Only on the stop response of a wallet session }
        maxCostPaise: { type: integer }
        city: { type: string }
        operator: { type: string }
        connectorPowerKw: { type: [number, "null"] }
        current: { type: string, enum: [AC, DC] }
        orderId: { type: [string, "null"], description: Set once billed; doubles as the receipt number }
        paymentRef: { type: [string, "null"], description: Gateway reference of the UPI payment }
        payment:
          type: object
          properties:
            method: { type: string, enum: [wallet, upi] }
            blockedPaise: { type: integer }
            capturedPaise: { type: integer }
            releasedPaise: { type: integer, description: Back to the customer's bank once stopped }
            status: { type: string }
    PaymentBlock:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING, AUTHORIZED, IN_USE, CAPTURED, RELEASED, FAILED, EXPIRED, CAPTURE_FAILED] }
        gateway: { type: string, enum: [mock, cashfree] }
        amountPaise: { type: integer }
        capturedPaise: { type: integer }
        approveBy: { type: string, format: date-time }
        upiIntentUrl: { type: string, description: "upi:// link that opens the customer's UPI app; only on create" }
    Connector:
      type: object
      required: [id, type, powerKw, status]
      properties:
        id: { type: integer }
        type: { type: string, enum: [CCS2, Type2, GBT, BharatDC001, LEV_AC, LECCS] }
        powerKw: { type: number }
        status: { type: string }
    Charger:
      type: object
      required: [id, operator, connectors, segments, access, pricePerKwhInr]
      properties:
        id: { type: string }
        operator: { type: string }
        connectors: { type: array, items: { $ref: "#/components/schemas/Connector" } }
        segments: { type: array, items: { $ref: "#/components/schemas/Segment" } }
        access: { type: string, enum: [public, fleet_only] }
        pricePerKwhInr: { type: [number, "null"] }
        place: { $ref: "#/components/schemas/Place" }
