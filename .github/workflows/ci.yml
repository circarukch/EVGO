name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evgo
          POSTGRES_PASSWORD: evgo_dev_only
          POSTGRES_DB: evgo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evgo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://evgo:evgo_dev_only@localhost:5432/evgo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @evgo/ocpp-gateway test
      - run: pnpm --filter @evgo/api test
      - run: pnpm --filter @evgo/api exec prisma validate
        env:
          DATABASE_URL: postgresql://ci@localhost/ci
      - run: pnpm build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
